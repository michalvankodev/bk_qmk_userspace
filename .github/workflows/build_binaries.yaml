name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: bastardkb/bastardkb-qmk
      qmk_ref: main

  publish:
    name: 'QMK Userspace Publish'
    # QMK's standard publish keeps a rolling "latest" release with the UF2s.
    # BastardKB's own publish workflow (bastardkb/qmk_userspace@main) requires
    # r<N> release tags which don't exist on this fork, so it fails.
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    if: always() && !cancelled()
    needs: build
